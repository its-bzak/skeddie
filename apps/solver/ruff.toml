line-length = 120

[lint]
# Pinned explicitly so a ruff upgrade cannot widen the rule set. Correctness
# checks only (pyflakes, core pycodestyle errors, bugbear), no style rewrites.
select = ["E4", "E7", "E9", "E501", "F", "B"]

[lint.flake8-bugbear]
# FastAPI declares dependencies as default arguments by design.
extend-immutable-calls = ["fastapi.Depends"]
