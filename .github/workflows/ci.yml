name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solver:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skeddie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/skeddie
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/skeddie_test
      PGPASSWORD: postgres

    defaults:
      run:
        working-directory: apps/solver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/solver/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations the way Docker does (psql, stop on first error)
        run: |
          for f in ../../packages/db/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d skeddie -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -d skeddie -c "SELECT version FROM schema_migrations ORDER BY version"

      - name: Run tests
        run: python -m pytest
